# airbg.org configuration.
#
# This file is mandatory and fully populated: this project keeps no defaults in
# code, so every key below must be present or the server refuses to start. A
# missing key is an error, never a zero value — for most of these, zero is the
# dangerous setting.
#
# Any key can be overridden by an environment variable named AIRBG_ + the key
# path, uppercased, with dots as underscores:
#   listen.metrics_addr         -> AIRBG_LISTEN_METRICS_ADDR
#   quality.ranges.pressure.min -> AIRBG_QUALITY_RANGES_PRESSURE_MIN
#
# One setting is deliberately absent and env-only, because it is a secret and
# this file is committed:
#   AIRBG_DATABASE_URL  - the PostgreSQL connection string
# Writing it into this file is a startup error, not an ignore. The basemap is
# self-hosted (see tiles: below) and has no vendor to authenticate to.

listen:
  # Loopback by default and on purpose. The origin must be unreachable except
  # through the CDN: CF-Connecting-IP is the only rate-limit bucket key, so a
  # scraper that reaches the origin directly bypasses every limiter in one hop.
  #
  # The rule is "never expose the origin", not "never bind 0.0.0.0". The
  # production deployment overrides this to 0.0.0.0:8080 and is safe doing so,
  # because that container publishes no port and is reachable only from the
  # reverse proxy on an internal Docker network — the namespace does the
  # enforcing. Binding 0.0.0.0 on a host with a published port is still the
  # mistake this comment warns about. See deploy/ and docs/deployment.md.
  addr: "127.0.0.1:8080"
  # The private listener carrying /metrics. Must differ from addr: sharing them
  # publishes the counters that show an attacker whether their probing is being
  # rate limited.
  metrics_addr: "127.0.0.1:9090"
  # Absolute origin used to build canonical and alternate-language URLs.
  base_url: "http://localhost:8080"
  # Hard ceiling on concurrent connections, applied to each internet-facing
  # listener: the public one, and the tiles one when tiles.* is configured.
  # 0 would mean unlimited, which is why absent is an error rather than a
  # default — and why the tiles listener shares this key instead of owning an
  # int of its own that would have to ship as 0.
  max_conns: 4096
  # CIDRs whose X-Forwarded-For / CF-Connecting-IP headers are believed. Empty
  # means trust nothing and bucket on the direct peer address.
  trusted_proxy_cidrs: []
  # No 'unsafe-inline' and no 'unsafe-eval', ever: the islands ship as external
  # modules and the map styles as external JSON, so nothing needs them, and an
  # inline-script allowance is the single most common way a CSP stops
  # mitigating XSS. img-src allows data: for MapLibre's canvas sprites and
  # blob: for its worker-produced tiles; worker-src blob: is required by
  # MapLibre GL JS, which builds its workers from blobs. Validation rejects
  # either unsafe directive, so this key cannot be used to disable the policy.
  csp: >-
    default-src 'self'; script-src 'self'; style-src 'self';
    img-src 'self' data: blob:; font-src 'self'; connect-src 'self';
    worker-src 'self' blob:; object-src 'none'; base-uri 'none';
    form-action 'none'; frame-ancestors 'none'
  # connect-src stays 'self' because tiles.* ships empty. Configuring a
  # basemap means adding tiles.public_url's origin here — validation refuses
  # to start otherwise, since a CSP-blocked fetch produces a blank map and no
  # error anywhere on the server.
  # Denies every browser capability the site does not use. The threat is the
  # frontend bundle itself: hundreds of transitive npm packages served
  # same-origin under a CSP that trusts 'self'. geolocation is scoped to
  # 'self' (never '*') because the "Find me" button (Phase 3c,
  # web/src/islands/map.js's locateMe) now exists and calls it from this
  # origin only — an empty allowlist denies the top-level document too, not
  # just third parties, which silently broke the button until Task 13's E2E
  # spec (web/e2e/locate.spec.js) caught it against this exact file.
  permissions_policy: "geolocation=(self), camera=(), microphone=(), payment=(), usb=()"

timeouts:
  read_header: "5s"
  read: "10s"
  write: "30s"
  idle: "60s"
  # How long in-flight requests get to finish after SIGTERM.
  shutdown_grace: "15s"

database:
  # Two pools: the API pool must not be starved by the collector's writes.
  api_conns: 8
  collector_conns: 4
  # Non-blocking admission semaphore in front of the database. Requests over
  # this limit are shed immediately rather than queued.
  max_inflight: 16
  statement_timeouts:
    # Applied to every connection as a RuntimeParam.
    default: "15s"
    # Area assignment walks the whole sensor table.
    assign: "60s"
    # Operator-triggered maintenance, run by hand, allowed to be slow.
    operator: "10m"
    # The tightest one, and the one that matters: /series is the most
    # expensive public query, so it is scoped well below the default.
    series: "5s"

ratelimit:
  # No retry_after here, and none is possible: the Retry-After on a 429 is
  # computed from the refusing client's own token deficit, so it names the
  # moment a token actually exists rather than a fixed guess.
  #
  # evict_interval is how often a limiter's map is swept for idle entries.
  # Bounding that map is a memory-exhaustion defence, so each limiter sweeps on
  # its OWN interval (internal/server/server.go's startEvicting). The one
  # exception is the enumerate/breadth limiter below, which has no
  # evict_interval key of its own and is swept on ratelimit.api's.
  api:
    per_second: 10
    burst: 60
    ttl: "30m"
    evict_interval: "5m"
  # The series routes are the expensive ones and get their own, much tighter
  # bucket. Worst case is one series request per page load.
  series:
    per_second: 1
    burst: 10
    ttl: "30m"
    evict_interval: "5m"
    # NOT the 429 hint: this is the Retry-After on the 503 the series routes
    # return when the database admission pool is full (api.admitQuery). Long
    # enough for in-flight queries to drain, short enough that a legitimate
    # reader's chart appears late rather than never.
    retry_after: "2s"
  # Breadth limiting: not about request rate but about how much of the dataset
  # one client can enumerate. Anti-extraction here is tiering plus rate
  # limiting, not authentication.
  enumerate:
    # Was 12, which turned an ordinary browsing session into a 15-minute wall at
    # the 13th area page — Bulgaria has 28 oblasti and comparing them is the
    # site's obvious use. 20 covers a long comparison session while still
    # costing a scraper real time: the corpus is roughly 80 area pages (27
    # cities + 28 oblasti + 24 Sofia districts + the country), so one address
    # needs about four hours to sweep it. Breadth limiting slows extraction; it
    # does not prevent it, and should not be described as if it did.
    areas_per_window: 20
    sensors_per_window: 40
    window: "1h"
    retry_after: "900s"
  # Bucket shards. Reduces lock contention; purely a performance knob.
  shard_count: 32

cache:
  # Deliberately half the poll interval: a client that caches for longer than
  # one ingest cycle can show a reading that has already been superseded.
  # Validation enforces data_max_age <= upstream.poll_interval / 2, so this
  # coupling is checked rather than left as a comment for a human to maintain.
  data_max_age: "150s"
  # The band tables change when legislation changes, which is to say never.
  scales_max_age: "86400s"

upstream:
  url: "https://data.sensor.community/airrohr/v1/filter/"
  # ISO 3166-1 alpha-2 allow list: builds the fetch filter and scopes the
  # boundaries a sensor is geometrically tested against. See docs/ingest-filter.md.
  countries: ["BG", "GR", "MK", "RO", "RS", "TR"]
  request_timeout: "30s"
  poll_interval: "5m"
  # Floor on poll_interval. Polling a volunteer-run public API faster than this
  # is abusive, so the floor is enforced rather than advisory.
  min_poll_interval: "30s"
  # 64 MiB. A response larger than this is a bug or an attack, not data.
  max_payload_bytes: 67108864

# The forecast wind overlay. Not measured — no sensor we ingest has an
# anemometer. See docs/wind-overlay.md.
wind:
  enabled: true
  url: "https://api.open-meteo.com/v1/forecast"
  model: "ecmwf_ifs025"
  # The model's grid, shown on the overlay: coarser than our 15 km hexes, so
  # neighbouring arrows repeat. Naming it is how the map admits the upsampling.
  resolution_deg: 0.25
  request_timeout: "30s"
  poll_interval: "1h"
  forecast_hours: 24
  points_per_request: 100
  # 16 MiB.
  max_payload_bytes: 16777216
  retention: "48h"

store:
  # Minimum sensors before an area gets a value at all. Below it the area is
  # painted "no data" — one sensor must never be presented as an oblast.
  coverage_threshold: 3
  # A reading older than this does not count toward an area's current value.
  freshness_window: "2h"

series:
  # Must match the first entry in periods below: the snapshot serves this
  # window without touching the database, and api.parsePeriod must derive the
  # same window from the default period name.
  default_metric: "P2"
  default_window: "24h"
  # The hourly flag is not a performance hint, it is a correctness
  # requirement. Raw readings are retained for 30 days, so a 1-year window
  # against the raw table silently returns the last 30 days under a "1 year"
  # label — a chart that is wrong without being empty.
  #
  # max_age is per period because each value needs its own justification: a
  # 24h chart of raw readings is a live view whose right edge moves every few
  # minutes, while a 1-year chart is hourly rollups where re-running the
  # heaviest query in the service repaints a single pixel.
  #
  # bucket is the chart's resolution, and is not the same decision as hourly:
  # sensors report asynchronously at second resolution, so without a bucket an
  # area series returns one point per sensor per report. Each value below is
  # chosen to land the series near 300 points, which is roughly the horizontal
  # pixel budget of the chart and also caps what a single request can extract.
  periods:
    - name: "24h"
      window: "24h"
      hourly: false
      bucket: "5m"
      max_age: "150s"
    - name: "7d"
      window: "168h"
      hourly: false
      bucket: "1h"
      max_age: "600s"
    - name: "30d"
      window: "720h"
      hourly: false
      bucket: "6h"
      max_age: "1800s"
    - name: "1y"
      window: "8760h"
      hourly: true
      bucket: "24h"
      max_age: "10800s"

quality:
  # Spatial outlier detection needs at least this many neighbours before its
  # verdict means anything.
  min_neighbours: 3
  # 1.4826 makes the median absolute deviation a consistent estimator of the
  # standard deviation for normally distributed data. This is a mathematical
  # constant, not a tuning parameter — changing it changes what the threshold
  # below means.
  mad_scale: 1.4826
  mad_threshold: 3.5
  neighbour_radius_metres: 15000.0
  # Mean Earth radius, used for the haversine distance. Also not a tunable.
  earth_radius_metres: 6371000.0
  # Readings kept per sensor for the rejection-rate history.
  history_depth: 12
  # The PM guard. A PM reading must exceed BOTH of these to be flagged: many
  # times the neighbourhood median AND high in absolute terms. That catches a
  # sensor stuck at 900 on a street reading 30 while leaving a genuine
  # 200 µg/m³ inversion episode untouched — PM is dominated by point sources,
  # so an extreme local reading is usually the signal, not noise (spec §6.3).
  pm_ratio_threshold: 5.0
  pm_absolute_threshold: 150.0
  # The metrics that vary smoothly across space, so neighbouring sensors
  # genuinely should agree. The floor is the smallest deviation that may ever
  # be called an outlier; it stops an unusually tight neighbourhood (MAD near
  # zero) from flagging normal variation.
  #
  # PM is deliberately not here — see the guard above. Noise is not here
  # either: it is genuinely local and has no spatial expectation at all, so it
  # is never spatially checked. Adding a key for either is a strict-decode
  # error, because which metrics are smooth is a code fact, not a setting.
  smooth_field_floors:
    temperature: 1.5
    humidity: 8.0
    pressure: 3.0
  # Plausibility gates. A reading outside its range is rejected before it can
  # reach an average. These are instrument ranges, not air-quality thresholds.
  ranges:
    P1:
      min: 0.0
      max: 1000.0
    P2:
      min: 0.0
      max: 1000.0
    temperature:
      min: -40.0
      max: 60.0
    humidity:
      min: 0.0
      max: 100.0
    # Bulgaria's inhabited altitudes run past 1600 m, where station pressure is
    # genuinely near 650 hPa. Do not "tidy" this back toward sea level: doing
    # so silently discards every reading from the mountain sensors.
    pressure:
      min: 650.0
      max: 1100.0
    noise_LAeq:
      min: 25.0
      max: 120.0
    noise_LA_max:
      min: 25.0
      max: 120.0
  # SDS011 saturation values, matched by exact equality. Not a range question.
  # See internal/quality/README.md.
  clamp_sentinels:
    P1: 1999.9
    P2: 999.9

backfill:
  # A backfill batch that rejects more than this fraction of its rows is
  # reported as suspect rather than silently accepted.
  high_rejection_fraction: 0.5

frontend:
  # These are paint values handed to WebGL layers and a canvas, so no CSS
  # rule can ever reach them — which is why they live here and not in
  # theme.css. The boundary is mechanical: if CSS can style it, it belongs in
  # internal/web/static/theme.css; if JS passes it to a canvas or a GL layer,
  # it belongs here. Band colours are NOT here — they come from
  # /api/v1/scales, so a legislative change stays a one-file server edit.
  #
  # Neutral grey, deliberately not a band colour: an area below the coverage
  # threshold must not be paintable as clean air.
  no_data_colour: "#9ca3af"
  # Shown when the selected metric has NO air-quality scale — temperature,
  # humidity, pressure and the two noise metrics, none of which /api/v1/scales
  # publishes bands for. Deliberately NOT no_data_colour: "we have no reading"
  # and "this metric has no band table" are different facts, and painting both
  # the same grey makes a working map indistinguishable from a broken one.
  # A muted blue-grey, distinct from both the no-data grey and every band colour.
  unscaled_colour: "#94a3b8"
  marker_stroke_colour: "#ffffff"
  # The ink for the reading printed beside each marker, and it is --fg. It
  # lives here rather than in theme.css for the reason the whole frontend block
  # does: a WebGL paint value is configuration, because no CSS rule can reach a
  # canvas layer. The halo behind it is marker_stroke_colour above.
  marker_label_colour: "#161616"
  empty_basemap_colour: "#eef2f5"
  chart_line_colour: "#2563eb"
  # Zoom thresholds for the country -> city -> sensor tiering. Below zoom_city
  # the map shows country-level aggregates; below zoom_sensor, city-level.
  zoom_city: 9
  zoom_sensor: 11
  # The national fallback view: roughly Bulgaria's centre, at a zoom that fits
  # the country. It is what the home page's map opens on and what
  # /api/v1/locate returns for a visitor abroad, a visitor whose location
  # cannot be determined, and every request in a deployment without
  # Cloudflare — one home for the value, because a page and an API answer that
  # disagree about "all of Bulgaria" is a bug nobody sees until it is live.
  default_zoom: 7
  default_lon: 25.4858
  default_lat: 42.7339

# The self-hosted basemap. Empty means no basemap: the map renders sensor
# markers over frontend.empty_basemap_colour and starts two listeners instead
# of three. That is the correct setting for local development — no vendor
# account, and no 300 MB file to download before the site runs.
#
# Set all four or none; a partial setting is a startup error, because a map
# that fetches from nowhere reports nothing. Generating the artefacts is a
# manual, few-times-a-year procedure: see docs/tiles.md.
#
# tiles.addr is a THIRD listener. It holds no database pool, no snapshot, no
# rate limiter and no admission semaphore, which is what makes it safe to
# expose directly while the application port accepts connections only from
# Cloudflare's ranges. Do not merge it into listen.addr: a single map load
# issues dozens of range requests and would exhaust the API bucket on the
# first pan.
#
# tiles.public_url's host MUST appear in listen.csp's connect-src, or the
# browser refuses every basemap fetch and the map is silently blank.
#
# tiles.archive names the PMTiles file, and must match the name written into
# style.json's pmtiles:// source. It carries the build date because responses
# are cached immutably for a year: regenerating the basemap must produce a NEW
# filename, or returning visitors keep serving themselves the old map. The
# handler serves this one archive name and no other, and refuses to start if the
# file is not there.
tiles:
  addr: ""        # e.g. "127.0.0.1:8082"
  dir: ""         # e.g. "/var/lib/airbg/tiles" — holds the archive, style.json, glyphs/
  public_url: ""  # e.g. "https://tiles.airbg.org"
  archive: ""     # e.g. "bulgaria-20260815.pmtiles" — regeneration changes this
  # Extra origins allowed to read the basemap cross-origin; listen.base_url is
  # always allowed and is not listed here. See docs/tiles.md.
  # Empty on purpose: the design kit is served from the site's own origin, so it
  # needs no entry. See docs/tiles.md §5b.
  allowed_origins: []
  # Also allow any http origin on the requesting machine (127.0.0.0/8, ::1,
  # localhost, any port) — for design-preview hosts, whose port is ephemeral and
  # so cannot be listed above. See docs/tiles.md §5c.
  allow_loopback_origins: false

# Message overrides. The site's copy lives in the embedded catalogues
# (internal/i18n/bg.json and en.json); this points at a directory of
# <lang>.json files whose keys are overlaid on top of them at startup, so a
# clumsy sentence or a translation a native speaker rejects can be corrected by
# editing a file and restarting — no rebuild, no new image.
#
# The same directory is how a language is ADDED. Write <code>.json — de.json,
# ro.json, de-at.json — holding every key the Bulgarian catalogue has, and that
# language is routed (/de/), listed in the switcher and offered as an hreflang
# alternate on the next restart. No rebuild, no database migration, no code
# change: nothing in the binary enumerates the languages. Area names need no
# column per language either — a non-Bulgarian language gets the stored
# Latin-script name_en by default, overridable with the optional catalogue key
# "area.name.<slug>".
#
# A filename that is not a language code, a new language missing keys the
# default catalogue holds, an unknown key, or a blank value is a startup error,
# not a warning: each one means the operator edited something that would
# otherwise have no effect, render an empty label, or serve a page half in
# another language. See docs/configuration.md.
#
# Read once, at startup. Changing a file does nothing until the process
# restarts. Empty means embedded only, which is the shipped setting.
i18n:
  dir: ""  # e.g. "/etc/airbg/messages" — holds bg.json and/or en.json

# The design kit — the static page set the web UI is refined against. Served
# under /design-kit/ from this directory, same origin as the site so the site's
# CSP covers it without being relaxed.
#
# This must be the OpenDesign PROJECT ROOT, not ui_kits/ inside it. The entry
# page ui_kits/app/index.html references ../../tokens.css, which resolves to the
# project root; pointing one level in serves the page with every stylesheet
# missing, which renders unstyled rather than erroring.
#
# That root is an editor's working directory, not a curated public tree, so the
# handler serves only five allowlisted roots — ui_kits/, assets/, tokens.css,
# colors_and_type.css, components.css — and refuses any path segment beginning
# with a dot at any depth. See docs/backlog/design-kit-route-decision.md.
#
# Empty means the route does not exist. Set to "" before the site is reachable
# from outside the LAN: the kit is a review surface, not part of the site.
design_kit:
  dir: "/design-kit"  # design-kit/ in the repo, copied in by the Dockerfile
