<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 30" width="20" height="12" role="img" aria-label="Flag of the United Kingdom">
  <!-- Union Flag, 3:5 land variant. Fetched from Wikimedia Commons
       (File:Flag_of_the_United_Kingdom_(3-5).svg), public domain — a real asset,
       not a hand-drawn approximation. The clipPath is what counterchanges the
       red saltire correctly; that offset is the detail an eyeballed Union Jack
       always gets wrong, which is why this was fetched rather than drawn. -->
  <clipPath id="uk-t">
    <path d="M25,15h25v15zv15h-25zh-25v-15zv-15h25z"/>
  </clipPath>
  <path d="M0,0v30h50v-30z" fill="#012169"/>
  <path d="M0,0 50,30M50,0 0,30" stroke="#fff" stroke-width="6"/>
  <path d="M0,0 50,30M50,0 0,30" clip-path="url(#uk-t)" stroke="#C8102E" stroke-width="4"/>
  <path d="M-1 11h22v-12h8v12h22v8h-22v12h-8v-12h-22z" fill="#C8102E" stroke="#FFF" stroke-width="2"/>
</svg>
