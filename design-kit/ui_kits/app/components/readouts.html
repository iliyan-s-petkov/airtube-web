<!-- Readouts — the measured-value strip.
     Every value states the tier it aggregates; a bare figure is a defect (§9).
     Numerals are tabular so a value does not reflow its own width as it updates. -->

<div class="readouts" data-od-id="readouts">
  <div class="readout">
    <span class="readout__label">ФПЧ2.5 сега</span>
    <span class="readout__value">52,1 <span class="readout__unit">µg/m³</span></span>
    <span class="readout__tier">средно за областта</span>
  </div>
  <div class="readout">
    <span class="readout__label">Най-висок сензор</span>
    <span class="readout__value">96,0 <span class="readout__unit">µg/m³</span></span>
    <span class="readout__tier">отделен сензор, кв. Тракия</span>
  </div>
  <div class="readout">
    <span class="readout__label">Сензори с данни</span>
    <span class="readout__value">57</span>
    <span class="readout__tier">от 61 в областта</span>
  </div>
</div>
