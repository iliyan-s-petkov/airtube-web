<!-- Sidebar — the aside beside a map or chart on a detail page.
     Sits in the narrow column of .split--2 (2fr / 1fr above 1056px, stacked below).
     Spec: DESIGN.md §4.1 containers, §4.4 depth (no shadow), §2.3 empty states. -->

<aside class="card" data-od-id="area-aside">
  <h2 class="t-card card__title">Сензори наблизо</h2>
  <p class="t-compact">Списъкът се ограничава по ниво на приближение. Това е мярка срещу изчерпателно изтегляне на регистъра, не техническо ограничение.</p>
  <!-- Absence of data is muted and uncoloured. It is not a warning. -->
  <p class="t-empty">Приближете още, за да видите отделните сензори.</p>
</aside>
