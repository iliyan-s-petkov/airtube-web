# Production deployment for airbg.org. One VPS, one environment.
#
# The security properties of this file are asserted by compose_test.go in this
# directory; read it before changing anything here.
#
# The application publishes NO port, in this file or any other. It is reachable
# only from caddy across the edge network. Direct access for development is an
# SSH local forward to the container address (docs/deployment.md), never a
# published port — so there is no line here to accidentally ship.
name: airbg

services:
  # The only service the internet can open a socket to. Two vhosts: airbg.org,
  # which requires Cloudflare's client certificate, and tiles.airbg.org, which
  # is public. See Caddyfile.
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/airbg/tls:/etc/caddy/tls:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge: {}
    depends_on:
      - app
    logging: &journal
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    image: airbg:${AIRBG_IMAGE_TAG}
    restart: unless-stopped
    env_file: [.env]
    # Binding 0.0.0.0 inside this container is correct AND safe: nothing is
    # published, so the only reachable route is caddy across edge.
    # ipv4_address is pinned so the SSH forward in docs/deployment.md has a
    # stable target; Docker's default allocator would move it on every up.
    networks:
      edge:
        ipv4_address: 172.28.0.10
      back:
        ipv4_address: 172.29.0.10
    volumes:
      - /var/lib/airbg/tiles:/var/lib/airbg/tiles:ro
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging: *journal

  db:
    image: timescale/timescaledb-ha:pg18
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db_data:/home/postgres/pgdata
    # back for app; collect for the ofelia-spawned `collect` job (see the
    # `collect` network below and deploy/ofelia.ini). Publishes no port
    # either way — this only adds a second private route to reach it from,
    # it does not put db on the public internet.
    networks:
      back: {}
      collect: {}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *journal

  # ofelia needs to start containers, which means the Docker socket, which is
  # root-equivalent on the host. It never gets it: this proxy holds the socket
  # read-only and exposes container creation and nothing else. Widening the
  # environment below re-creates the risk the proxy exists to remove —
  # compose_test.go fails if it happens.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - POST=1
      - EXEC=0
      - IMAGES=0
      - NETWORKS=0
      - VOLUMES=0
      - INFO=0
      - SWARM=0
      - SYSTEM=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      sched: {}
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging: *journal

  # Runs `airbg collect` on the poll interval and pg_dump nightly, each as a
  # one-shot container from the same image. Talks to the proxy, never to the
  # daemon.
  ofelia:
    image: mcuadros/ofelia:0.3.20
    restart: unless-stopped
    command: ["daemon", "--config=/etc/ofelia/config.ini"]
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
    volumes:
      - ./ofelia.ini:/etc/ofelia/config.ini:ro
    networks:
      sched: {}
    depends_on:
      - socket-proxy
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging: *journal

networks:
  # Subnets are explicit so AIRBG_LISTEN_TRUSTED_PROXY_CIDRS is a value you can
  # write down. Trusting the wrong CIDR means CF-Connecting-IP is ignored and
  # every visitor shares one rate-limit bucket.
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  back:
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24
  sched:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  # Egress for exactly one thing: ofelia's `collect` job, which must reach
  # https://data.sensor.community (airbg.yaml's upstream.url) — impossible
  # from `back`, which is `internal: true` on purpose. Deliberately NOT
  # internal, and deliberately not shared with app or caddy: only db (for the
  # collect job's own DB writes — see deploy/ofelia.ini) and the collect job
  # itself ever attach here. ofelia's INI `network =` key holds exactly one
  # network per job — verified against a running ofelia container by
  # inspecting the resulting NetworkSettings.Networks, where a second
  # `network =` line silently replaces the first instead of adding to it —
  # so `back` and `collect` cannot both be listed for one job. Putting db on
  # this network too, rather than adding a second network to the job, is the
  # only way for one one-shot container to reach both the database and the
  # internet without making `back` itself non-internal, which would hand
  # every service on it — `app` included — the same egress this network
  # grants to db alone.
  collect:
    ipam:
      config:
        - subnet: 172.31.0.0/24

volumes:
  db_data:
  caddy_data:
  caddy_config:
