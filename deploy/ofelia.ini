; Scheduled jobs for airbg.org. Each runs as a one-shot container; ofelia
; itself holds no application code and no database credentials beyond what it
; passes through.
;
; job-run starts a NEW container per invocation rather than exec-ing into the
; running one. That is deliberate: the app image has no shell, the serving
; container is read-only, and a collector crash must never take the site down.
;
; ofelia's INI parser is not shell-aware: it splits `command =` on whitespace
; and strips any double-quote character it finds anywhere in the value,
; regardless of nesting. A double-quoted `sh -c "..."` value is silently torn
; into one argv element per word — verified against a running ofelia container
; by inspecting the resulting Cmd array, and it turns `sh -c "pg_dump ..."`
; into `sh -c pg_dump` with everything else discarded as unused positional
; parameters to the shell, so pg_dump runs with none of its flags. Every
; `command =` below is wrapped in single quotes instead, which ofelia leaves
; alone; nothing inside that single-quoted value may itself use a double or
; single quote. That constraint is load-bearing and easy to forget: an
; unescaped glob is expanded by the shell against the container's working
; directory before the command ever runs. "That directory is unrelated to
; /backups so nothing can match" is not a safety argument, it is a bet on the
; image's contents — and losing it is silent: verified locally that a single
; stray `airbg-*.dump`-shaped file in the working directory rewrites
; `find /backups -name airbg-*.dump` into a search for that one literal name,
; which matches nothing and makes the staleness check below fire every night
; against a backup directory that is perfectly healthy.
;
; A backslash escape is NOT the answer, though it reads like the obvious one.
; This file is parsed twice, and the two parsers disagree: the INI layer runs
; first and rejects a backslash outright, complaining that an unquoted one must
; be followed by a new line or a double quote. ofelia then refuses the whole
; config, crash-loops, and every job silently stops — a much larger failure
; than the one being prevented. A test enforces that no backslash appears
; anywhere in this file, which is why this paragraph spells the word out.
; `set -f` turns pathname expansion off for the rest of the command and is
; plain words, so it survives the INI layer, the double-quote stripping and
; the shell alike. Any command below that names a glob must start with it.

; This job-run is started fresh by the Docker API, not by Compose, so — same
; as the backup job below — it inherits nothing from the daemon, from ofelia,
; or from the app service; docker-compose.prod.yml's `app.env_file: [.env]`
; never reaches it. AIRBG_CONFIG alone (the only line this job carried before)
; is a no-op: Dockerfile already ENV AIRBG_CONFIG=/etc/airbg/airbg.yaml as the
; image default. Without AIRBG_DATABASE_URL set some other way,
; internal/config.Validate makes that fatal at startup, every 5 minutes,
; silently, since nothing watches a job-run container's exit code here.
;
; AIRBG_DATABASE_URL_FILE names a file containing the credential instead of
; carrying it, mirroring PGPASSFILE below: bind-mounted read-only from the
; host at /srv/airbg/airbg_database_url, which must exist, be owned by root,
; and be chmod 600, containing the full DSN on one line, e.g.
; postgres://airbg:<password>@db:5432/airbg?sslmode=disable — the same value
; as AIRBG_DATABASE_URL in /srv/airbg/.env. Unlike PGPASSFILE, libpq does not
; read this for us: the airbg binary itself reads
; AIRBG_DATABASE_URL_FILE (internal/config/load.go), because the image is
; distroless with no shell to pipe a file into an env var, and
; AIRBG_DATABASE_URL directly would mean writing the secret into this file.
;
; network = airbg_back gets this job to db. It also gets it to the internet,
; which it needs for https://data.sensor.community (airbg.yaml's upstream.url),
; and that is NOT because airbg_back has a route out — it is `internal: true`
; and it does not.
;
; ofelia attaches every job-run container to Docker's DEFAULT BRIDGE NETWORK in
; addition to the one named by `network =`. `internal: true` therefore does not
; deny a job-run container egress. This is empirical, not documented behaviour;
; verified against this file's pinned image (mcuadros/ofelia:0.3.20) by running
; a job on an `--internal` network and inspecting the resulting container:
;
;   NETWORKS=bridge probe_back
;   nc -z data.sensor.community 443  ->  EGRESS_OK
;
; The same is true of the `backup` and `backup-prune` jobs below: both say
; `network = airbg_back`, and both are on the default bridge too, so both have
; internet egress despite airbg_back being internal. They do not use it, but do
; not write a comment anywhere claiming they cannot.
;
; This job cannot be given an explicit second network instead. ofelia's
; `network =` key holds exactly ONE network per job: a second `network =` line
; silently replaces the first rather than adding to it — verified on 0.3.20 by
; giving one job `network = probe_back` then `network = probe_collect` and
; inspecting NetworkSettings.Networks, which showed `bridge probe_collect` and
; no probe_back. So a dedicated non-internal network carrying only this job and
; not db is not a usable shape: the job would reach the internet and lose the
; database. Putting db on such a network instead is what this file used to do,
; and it handed db real egress for no gain — reverted.
;
; If a future ofelia stops bridge-attaching job-run containers, this job loses
; the internet and every collect run fails at the upstream fetch. Nothing here
; watches a job-run exit code, so that failure is silent; re-check this after
; any bump of the ofelia image pin above.
; pull = false on every job below. ofelia pulls a job's image before each run
; by default, and a pull can only ever fail here: airbg:latest is built on this
; host by the deploy and exists in no registry, and the database image is
; already local because the db service runs it. A failed pull fails the job,
; and nothing watches a job-run's exit code, so the collector was failing every
; five minutes in silence until this was set.
;
; `pull = false` is not enough on its own, and that surprise is worth writing
; down: ofelia still asks the daemon whether the image exists
; (GET /images/json) before creating the container. So the socket proxy must
; set IMAGES=1 — with IMAGES=0 that check 403s and no job runs at all. See the
; socket-proxy service in docker-compose.prod.yml for what that costs.
[job-run "collect"]
schedule = @every 5m
image = airbg:latest
pull = false
network = airbg_back
command = collect
environment = AIRBG_CONFIG=/etc/airbg/airbg.yaml
environment = AIRBG_DATABASE_URL_FILE=/secrets/airbg_database_url
volume = /srv/airbg/airbg_database_url:/secrets/airbg_database_url:ro
delete = true

; pg_dump runs from the database image, which has the client tools and a
; shell. -Fc is the custom format: compressed, and restorable selectively.
;
; This job-run is started fresh by the Docker API, not by Compose, so it
; inherits nothing from the daemon, from ofelia, or from the db service —
; POSTGRES_USER/POSTGRES_DB would expand empty here. PGUSER/PGDATABASE/
; PGPASSFILE below are libpq's own env vars, set explicitly for this job.
; PGPASSFILE points at a pgpass file bind-mounted read-only from the host at
; /srv/airbg/pgpass, which must exist, be owned by root, and be chmod 600 —
; pg_dump silently ignores a pgpass file with looser permissions, in
; "hostname:port:database:username:password" format, one line, e.g.
; db:5432:airbg:airbg:<password>.
;
; -f instead of a shell `>` redirect: `>` truncates/creates the destination
; before pg_dump runs, so a total failure still leaves a plausible-looking
; empty/partial file where the previous night's dump used to be. Writing to
; a .partial path and only `mv`-ing it into place on success means a failed
; run leaves last night's dump untouched instead of masquerading as tonight's.
[job-run "backup"]
schedule = 0 30 3 * * *
image = timescale/timescaledb-ha:pg18
pull = false
network = airbg_back
environment = PGUSER=airbg
environment = PGDATABASE=airbg
environment = PGPASSFILE=/secrets/pgpass
volume = /var/backups/airbg:/backups
volume = /srv/airbg/pgpass:/secrets/pgpass:ro
command = sh -c 'pg_dump -Fc -h db -f /backups/.partial.dump && mv /backups/.partial.dump /backups/airbg-$(date +%Y%m%d).dump'
delete = true

; Retention, and the staleness alarm.
;
; Without the prune the backup job fills the disk, which is the same denial of
; service the rate limiters exist to prevent, arriving by a different door. The
; glob only matches finished dumps (airbg-YYYYMMDD.dump); the backup job's
; in-progress .partial.dump never matches it, so a crash mid-dump cannot have
; its only survivor pruned out from under it.
;
; The second half is the alarm, and it is the part that matters. A failing
; backup is otherwise SILENT: the `&&` in the backup job short-circuits, the
; container exits non-zero and is immediately removed (delete = true), and last
; night's dump stays in place — so the directory looks healthy and the only
; symptom is that its newest file quietly stops advancing. On a single VPS with
; no replica, that is discovered when a restore is attempted, which is the
; worst possible moment to discover it.
;
; So: if no finished dump is newer than 48 hours, write a file named
; BACKUP-IS-STALE into the backup directory and exit non-zero. Two channels on
; purpose. The non-zero exit reaches ofelia's own log; the marker file sits in
; the directory an operator actually looks at, named so that `ls` alone tells
; the story, and it clears itself on the next successful backup. 48 rather than
; 24 hours so a single missed night — a reboot, a slow dump crossing the prune
; window — does not cry wolf, while two consecutive failures always do.
;
; The alarm runs AFTER the prune, deliberately: if retention has just deleted
; the last dump because nothing new arrived for 14 days, that is precisely the
; state worth shouting about.
;
; Written without a single double-quote character, which is why it uses
; `find ... | grep -q .` rather than the more obvious `[ -z "$(find ...)" ]`:
; ofelia strips double quotes from a command value (see the header), so that
; form would reach sh as `[ -z ]` — a one-argument test that is ALWAYS true —
; and the alarm would fire every night no matter how healthy the backups are.
; A false alarm that never stops is worse than no alarm, because it trains the
; operator to ignore the one signal this job exists to send.
;
; `set -f` guards both globs, for the reason given in the header.
;
; And no semicolons, which is why this command chains with `&&`, `||` and
; subshells where `if ... then ... else ... fi` would read better. A semicolon
; is a comment character to ofelia's INI parser, and the value is not
; double-quoted (it cannot be — see the header), so everything from the first
; `;` onward is discarded. Caught on the running host: ofelia logged
;   New job registered "backup-prune" - "sh -c 'set -f"
; while the `backup` job, which contains no semicolon, logged its command in
; full. The job was scheduled, ran nightly, and did nothing — no prune, no
; alarm, no error. Read ofelia's own startup log after editing any command
; here: it prints what it actually parsed, which is the only place the
; difference shows.
[job-run "backup-prune"]
schedule = 0 45 3 * * *
image = timescale/timescaledb-ha:pg18
pull = false
network = airbg_back
volume = /var/backups/airbg:/backups
command = sh -c 'set -f && find /backups -name airbg-*.dump -mtime +14 -delete && (find /backups -name airbg-*.dump -mtime -2 | grep -q . && rm -f /backups/BACKUP-IS-STALE || (echo backup-prune: no finished dump newer than 48h in /backups - the nightly backup is not completing | tee /backups/BACKUP-IS-STALE >&2 && exit 1))'
delete = true
