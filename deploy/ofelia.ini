; Scheduled jobs for airbg.org, each a one-shot container.
; READ README.md IN THIS DIRECTORY BEFORE EDITING A COMMAND: a double quote,
; a semicolon, a hash or a backslash each break a job silently.

; No collect job here on purpose. `airbg serve` polls in-process — see the
; comment at cmd/airbg/main.go:261 — and `airbg collect` never returns, so a
; job-run scheduling it leaked one immortal container every 5 minutes.

; No backup job here on purpose. It needed `network = airbg_back` to resolve
; `db`, and the socket proxy sets NETWORKS=0, so the attach never happened and
; every run failed. It is airbg-backup.timer on the host now — README.md, "Why
; the backup is a systemd timer". This job needs no network, only the volume.

; Retention, then the staleness alarm: nothing newer than 48h drops a
; BACKUP-IS-STALE marker and exits non-zero. See README.md.
[job-run "backup-prune"]
schedule = 0 45 3 * * *
image = timescale/timescaledb-ha:pg18
pull = false
volume = /var/backups/airbg:/backups
command = sh -c 'set -f && find /backups -name airbg-*.dump -mtime +14 -delete && (find /backups -name airbg-*.dump -mtime -2 | grep -q . && rm -f /backups/BACKUP-IS-STALE || (echo backup-prune: no finished dump newer than 48h in /backups - the nightly backup is not completing | tee /backups/BACKUP-IS-STALE >&2 && exit 1))'
delete = true
