; Scheduled jobs for airbg.org. Each runs as a one-shot container; ofelia
; itself holds no application code and no database credentials beyond what it
; passes through.
;
; job-run starts a NEW container per invocation rather than exec-ing into the
; running one. That is deliberate: the app image has no shell, the serving
; container is read-only, and a collector crash must never take the site down.
;
; ofelia's INI parser is not shell-aware: it splits `command =` on whitespace
; and strips any double-quote character it finds anywhere in the value,
; regardless of nesting. A double-quoted `sh -c "..."` value is silently torn
; into one argv element per word — verified against a running ofelia container
; by inspecting the resulting Cmd array, and it turns `sh -c "pg_dump ..."`
; into `sh -c pg_dump` with everything else discarded as unused positional
; parameters to the shell, so pg_dump runs with none of its flags. Every
; `command =` below is wrapped in single quotes instead, which ofelia leaves
; alone; nothing inside that single-quoted value may itself use a double or
; single quote, so the `find -name` glob below is deliberately unquoted — safe
; because these images' default working directory is unrelated to /backups,
; so the shell never has a matching filename to expand it against.

; This job-run is started fresh by the Docker API, not by Compose, so — same
; as the backup job below — it inherits nothing from the daemon, from ofelia,
; or from the app service; docker-compose.prod.yml's `app.env_file: [.env]`
; never reaches it. AIRBG_CONFIG alone (the only line this job carried before)
; is a no-op: Dockerfile already ENV AIRBG_CONFIG=/etc/airbg/airbg.yaml as the
; image default. Without AIRBG_DATABASE_URL set some other way,
; internal/config.Validate makes that fatal at startup, every 5 minutes,
; silently, since nothing watches a job-run container's exit code here.
;
; AIRBG_DATABASE_URL_FILE names a file containing the credential instead of
; carrying it, mirroring PGPASSFILE below: bind-mounted read-only from the
; host at /srv/airbg/airbg_database_url, which must exist, be owned by root,
; and be chmod 600, containing the full DSN on one line, e.g.
; postgres://airbg:<password>@db:5432/airbg?sslmode=disable — the same value
; as AIRBG_DATABASE_URL in /srv/airbg/.env. Unlike PGPASSFILE, libpq does not
; read this for us: the airbg binary itself reads
; AIRBG_DATABASE_URL_FILE (internal/config/load.go), because the image is
; distroless with no shell to pipe a file into an env var, and
; AIRBG_DATABASE_URL directly would mean writing the secret into this file.
;
; network = airbg_collect, not airbg_back: this job also needs to reach
; https://data.sensor.community (airbg.yaml's upstream.url), and airbg_back is
; `internal: true` — no route out. ofelia's `network =` key holds exactly one
; network per job; a second `network =` line here would silently replace this
; one instead of adding to it, verified against a running ofelia container by
; inspecting the resulting container's NetworkSettings.Networks. airbg_collect
; is where db additionally listens for this job specifically — see
; docker-compose.prod.yml's networks: section for why that is the safer side
; to extend rather than making airbg_back itself non-internal.
[job-run "collect"]
schedule = @every 5m
image = airbg:latest
network = airbg_collect
command = collect
environment = AIRBG_CONFIG=/etc/airbg/airbg.yaml
environment = AIRBG_DATABASE_URL_FILE=/secrets/airbg_database_url
volume = /srv/airbg/airbg_database_url:/secrets/airbg_database_url:ro
delete = true

; pg_dump runs from the database image, which has the client tools and a
; shell. -Fc is the custom format: compressed, and restorable selectively.
;
; This job-run is started fresh by the Docker API, not by Compose, so it
; inherits nothing from the daemon, from ofelia, or from the db service —
; POSTGRES_USER/POSTGRES_DB would expand empty here. PGUSER/PGDATABASE/
; PGPASSFILE below are libpq's own env vars, set explicitly for this job.
; PGPASSFILE points at a pgpass file bind-mounted read-only from the host at
; /srv/airbg/pgpass, which must exist, be owned by root, and be chmod 600 —
; pg_dump silently ignores a pgpass file with looser permissions, in
; "hostname:port:database:username:password" format, one line, e.g.
; db:5432:airbg:airbg:<password>.
;
; -f instead of a shell `>` redirect: `>` truncates/creates the destination
; before pg_dump runs, so a total failure still leaves a plausible-looking
; empty/partial file where the previous night's dump used to be. Writing to
; a .partial path and only `mv`-ing it into place on success means a failed
; run leaves last night's dump untouched instead of masquerading as tonight's.
[job-run "backup"]
schedule = 0 30 3 * * *
image = timescale/timescaledb-ha:pg18
network = airbg_back
environment = PGUSER=airbg
environment = PGDATABASE=airbg
environment = PGPASSFILE=/secrets/pgpass
volume = /var/backups/airbg:/backups
volume = /srv/airbg/pgpass:/secrets/pgpass:ro
command = sh -c 'pg_dump -Fc -h db -f /backups/.partial.dump && mv /backups/.partial.dump /backups/airbg-$(date +%Y%m%d).dump'
delete = true

; Retention. Without this the backup job fills the disk, which is the same
; denial of service the rate limiters exist to prevent, arriving by a
; different door. The glob only matches finished dumps (airbg-YYYYMMDD.dump);
; the backup job's in-progress .partial.dump never matches it, so a crash
; mid-dump cannot have its only survivor pruned out from under it.
[job-run "backup-prune"]
schedule = 0 45 3 * * *
image = timescale/timescaledb-ha:pg18
network = airbg_back
volume = /var/backups/airbg:/backups
command = sh -c 'find /backups -name airbg-*.dump -mtime +14 -delete'
delete = true
