<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5 3" width="20" height="12" role="img" aria-label="Flag of England">
  <!-- Flag of England (St George's Cross). Official construction: ratio 3:5,
       cross one fifth of the height. Colours per the flag institute:
       white #FFFFFF, red #CE1124. -->
  <rect width="5" height="3" fill="#FFFFFF"/>
  <rect x="2.2" width="0.6" height="3" fill="#CE1124"/>
  <rect y="1.2" width="5" height="0.6" fill="#CE1124"/>
</svg>
