name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: '1.26'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # internal/web serves the EMBEDDED bundle (//go:embed all:dist), which is
      # not committed, so its tests 404 unless the build runs first.
      - run: npm run build
        working-directory: web
      - run: go build ./...
      # contract.json is generated from Go and committed; a stale copy is what
      # let BBoxQuantumDegrees and BBOX_QUANTUM_DEG disagree for two commits.
      # git ls-files fails a build where the file has been gitignored, which
      # would make the diff check below pass on nothing to compare.
      - run: git ls-files --error-unmatch web/src/lib/contract.json
      - run: go run ./cmd/airbg contract
      - name: contract.json is up to date
        run: |
          git diff --exit-code -- web/src/lib/contract.json || {
            echo "::error::web/src/lib/contract.json is stale. Run: go run ./cmd/airbg contract (from the repo root) and commit the result."
            exit 1
          }
      - run: go vet ./...
      # go vet does not compile files behind a build tag, so the
      # integration- and e2e-tagged test files are otherwise invisible to it.
      - run: go vet -tags integration ./...
      - run: go vet -tags e2e ./...
      # staticcheck excludes tagged files for the same reason go vet does, so
      # it needs the same two extra runs. Proven by mutation rather than
      # assumed: an S1039 defect planted in internal/e2e/e2e_test.go leaves the
      # untagged run silent at exit 0 and is caught by the tagged one.
      #
      # Both analysers are pinned to an exact version, never @latest. @latest
      # resolves and EXECUTES whatever the module proxy serves that morning,
      # inside a job with the repository checked out -- a supply-chain surface
      # go.sum does not cover, since these tools are not module dependencies.
      # It also makes a run unreproducible: the same commit goes red when
      # upstream adds a check, at a moment unrelated to anything in this repo,
      # which trains people to re-run CI instead of reading it. Bump these
      # deliberately, in a commit of their own. internal/ci enforces it.
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 -tags integration ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 -tags e2e ./...
      # -test is what makes the tagged govulncheck runs mean anything: it
      # defaults to FALSE, so govulncheck opens no _test.go file at all and
      # -tags on its own would be an inert flag that looks like coverage.
      # The untagged run stays the authoritative production scan -- the binary
      # ships none of this; these two cover the test-only dependency surface
      # (testcontainers and the docker client it pulls in) that still executes
      # on CI runners and developer machines.
      #
      # Pinning govulncheck does NOT stale its findings, which is the obvious
      # objection to pinning a security tool: govulncheck queries the live
      # vulnerability database (vuln.go.dev) at run time, so a pinned binary
      # still learns about a CVE published this morning. The pin freezes the
      # analyser, not the advisories.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -test -tags integration ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -test -tags e2e ./...
      - run: go test ./... -race

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # npm ci, not npm install: it fails on a lockfile that does not match
      # package.json instead of quietly resolving a different tree than the
      # one that was reviewed.
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: '1.26'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # internal/web serves the EMBEDDED bundle (//go:embed all:dist), which is
      # not committed, so its tests 404 unless the build runs first.
      - run: npm run build
        working-directory: web
      # testcontainers starts Postgres itself; no services: block, so the
      # container image and extensions match what runs locally.
      - run: go test -tags integration ./... -race

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: '1.26'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # The Go test serves the EMBEDDED bundle, so the build must run first or
      # every island is missing and every spec fails for the wrong reason.
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: go test -tags e2e ./internal/e2e/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
