name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - run: go build ./...
      - run: go vet ./...
      # go vet does not compile files behind a build tag, so the
      # integration- and e2e-tagged test files are otherwise invisible to it.
      - run: go vet -tags integration ./...
      - run: go vet -tags e2e ./...
      # staticcheck excludes tagged files for the same reason go vet does, so
      # it needs the same two extra runs. Proven by mutation rather than
      # assumed: an S1039 defect planted in internal/e2e/e2e_test.go leaves the
      # untagged run silent at exit 0 and is caught by the tagged one.
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest -tags integration ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest -tags e2e ./...
      # -test is what makes the tagged govulncheck runs mean anything: it
      # defaults to FALSE, so govulncheck opens no _test.go file at all and
      # -tags on its own would be an inert flag that looks like coverage.
      # The untagged run stays the authoritative production scan -- the binary
      # ships none of this; these two cover the test-only dependency surface
      # (testcontainers and the docker client it pulls in) that still executes
      # on CI runners and developer machines.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest -test -tags integration ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest -test -tags e2e ./...
      - run: go test ./... -race

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # npm ci, not npm install: it fails on a lockfile that does not match
      # package.json instead of quietly resolving a different tree than the
      # one that was reviewed.
      - run: npm ci
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      # testcontainers starts Postgres itself; no services: block, so the
      # container image and extensions match what runs locally.
      - run: go test -tags integration ./... -race

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # The Go test serves the EMBEDDED bundle, so the build must run first or
      # every island is missing and every spec fails for the wrong reason.
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: go test -tags e2e ./internal/e2e/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
